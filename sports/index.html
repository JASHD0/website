<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fall 2026 Sports Calendar</title>
    <!-- Favicon (Retro Game Controller) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ff007f'/><circle cx='30' cy='50' r='10' fill='%2300ffff'/><circle cx='70' cy='50' r='10' fill='%2339ff14'/></svg>">
    <!-- Google Fonts: Press Start 2P for retro headers, Outfit for body readability -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Retro Game Design Tokens */
        :root {
            --bg-dark: #070810;
            --screen-bg: #121424;
            --neon-green: #39ff14;
            --neon-pink: #ff007f;
            --neon-blue: #00ffff;
            --neon-yellow: #ffff00;
            --border-pixel: 4px solid #ffffff;
            --font-retro: 'Press Start 2P', monospace;
            --font-body: 'Outfit', sans-serif;
            
            /* Team Colors */
            --color-dolphins: #008E97;
            --color-marlins: #00A3E0;
            --color-liverpool: #C8102E;
            --color-heat: #FF007F; /* Miami Vice Hot Pink */
            --color-panthers: #1D428A; /* Florida Panthers Bright Navy */
            --color-ucf: #BA9B37;
            --color-uf: #0021A5;
            --color-campbell: #FF8A00; /* Brighter Camels Orange */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: var(--font-body);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 1rem 0.5rem;
            position: relative;
        }

        @media (min-width: 768px) {
            body {
                padding: 2rem 1rem;
            }
        }

        /* Scanline Overlay for CRT feel */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.06),
                rgba(0, 255, 0, 0.02),
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 6px 100%;
            z-index: 9999;
            pointer-events: none;
        }

        /* Flicker Effect */
        @keyframes crt-flicker {
            0% { opacity: 0.99; }
            50% { opacity: 0.97; }
            100% { opacity: 0.99; }
        }

        /* Main Cabinet Container */
        .arcade-cabinet {
            width: 100%;
            max-width: 1200px;
            background-color: #2b2b3a;
            border: 4px solid #1c1c28;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 
                        inset 0 0 10px rgba(255, 255, 255, 0.1);
            padding: 0.75rem;
            position: relative;
            animation: crt-flicker 0.15s infinite;
        }

        @media (min-width: 768px) {
            .arcade-cabinet {
                border-width: 8px;
                border-radius: 20px;
                padding: 1.5rem;
            }
        }

        /* Top Header Board */
        .scoreboard {
            background-color: #000000;
            border: 3px solid var(--neon-pink);
            border-radius: 8px;
            padding: 0.75rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
            width: 100%;
            box-sizing: border-box;
        }

        @media (min-width: 768px) {
            .scoreboard {
                border-width: 4px;
                padding: 1rem;
                margin-bottom: 1.5rem;
            }
        }

        .scoreboard-title {
            font-family: var(--font-retro);
            font-size: clamp(0.5rem, 2vw, 0.85rem);
            color: var(--neon-green);
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .scoreboard-meta {
            font-family: var(--font-retro);
            font-size: 0.55rem;
            color: var(--neon-blue);
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        @media (min-width: 768px) {
            .scoreboard-meta {
                font-size: 0.7rem;
                gap: 1.5rem;
            }
        }

        .clock-blinker {
            animation: blink 1s infinite steps(1);
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Main Dashboard Grid */
        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        #game-detail-panel {
            order: 1;
        }
        #calendar-board {
            order: 2;
        }
        #month-list-panel {
            order: 3;
        }


        @media (min-width: 900px) {
            .dashboard {
                display: grid;
                grid-template-columns: 2.2fr 1fr;
                grid-template-rows: auto 1fr;
                gap: 1.5rem;
            }
            #calendar-board {
                grid-column: 1;
                grid-row: 1 / span 2;
            }
            #game-detail-panel {
                grid-column: 2;
                grid-row: 1;
            }
            #month-list-panel {
                grid-column: 2;
                grid-row: 2;
            }
        }

        /* Control Panel (Filters) */
        .control-panel {
            background-color: var(--screen-bg);
            border: 3px solid var(--neon-blue);
            border-radius: 8px;
            padding: 0.75rem;
            margin-bottom: 1rem;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
            width: 100%;
            box-sizing: border-box;
        }

        @media (min-width: 768px) {
            .control-panel {
                border-width: 4px;
                padding: 1.25rem;
                margin-bottom: 1.5rem;
            }
        }

        .panel-header {
            font-family: var(--font-retro);
            font-size: 0.65rem;
            color: #ffffff;
            margin-bottom: 0.75rem;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.2);
            padding-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        @media (min-width: 768px) {
            .panel-header {
                font-size: 0.8rem;
                margin-bottom: 1rem;
            }
        }

        .selectors-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        /* Retro Arcade Buttons */
        .arcade-btn {
            font-family: var(--font-retro);
            font-size: 0.55rem;
            color: #ffffff;
            background: #191b2c;
            border: 2px solid var(--team-color, #ffffff);
            border-radius: 4px;
            padding: 0.5rem 0.3rem;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            text-shadow: 1px 1px 0px #000;
            box-shadow: 0 3px 0px var(--team-shadow, #888);
            position: relative;
            user-select: none;
            white-space: nowrap;
        }

        @media (min-width: 768px) {
            .arcade-btn {
                font-size: 0.6rem;
                border-width: 3px;
                border-radius: 6px;
                padding: 0.6rem 0.4rem;
                box-shadow: 0 4px 0px var(--team-shadow, #888);
            }
        }

        @media (min-width: 900px) {
            .arcade-btn {
                font-size: 0.6rem;
                padding: 0.6rem 0.5rem;
            }
        }

        .arcade-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0px var(--team-shadow, #888);
        }

        @media (min-width: 768px) {
            .arcade-btn:active {
                transform: translateY(3px);
                box-shadow: 0 1px 0px var(--team-shadow, #888);
            }
        }

        .arcade-btn.disabled {
            filter: grayscale(0.8) brightness(0.6);
            opacity: 0.5;
            box-shadow: 0 1px 0px #333;
            transform: translateY(2px);
        }

        .btn-badge {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--neon-green);
            display: inline-block;
        }

        @media (min-width: 768px) {
            .btn-badge {
                width: 8px;
                height: 8px;
            }
        }

        .arcade-btn.disabled .btn-badge {
            background-color: #ff0055;
        }

        /* Sound Deck */
        .sound-deck {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .sound-btn {
            background: #000000;
            border: 2px solid var(--neon-green);
            border-radius: 6px;
            color: var(--neon-green);
            font-family: var(--font-retro);
            font-size: 0.5rem;
            padding: 0.35rem 0.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            box-shadow: 0 0 5px rgba(57, 255, 20, 0.3);
        }

        @media (min-width: 768px) {
            .sound-btn {
                font-size: 0.55rem;
                padding: 0.4rem 0.75rem;
            }
        }

        .sound-btn:hover {
            background: var(--neon-green);
            color: #000000;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-family: var(--font-retro);
            font-size: 0.5rem;
            color: var(--neon-green);
        }

        @media (min-width: 768px) {
            .volume-container {
                font-size: 0.55rem;
            }
        }

        .volume-slider {
            -webkit-appearance: none;
            width: 60px;
            height: 6px;
            background: #2b2b3a;
            border: 1px solid var(--neon-green);
            border-radius: 4px;
            outline: none;
        }

        @media (min-width: 768px) {
            .volume-slider {
                width: 80px;
                height: 8px;
            }
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            background: var(--neon-green);
            border-radius: 50%;
            cursor: pointer;
        }

        /* Calendar Card Container */
        .calendar-section {
            background-color: var(--screen-bg);
            border: 3px solid var(--neon-green);
            border-radius: 8px;
            padding: 0.75rem;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            .calendar-section {
                border-width: 4px;
                padding: 1.25rem;
            }
        }

        /* Month Navigation */
        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            background-color: rgba(0, 0, 0, 0.4);
            padding: 0.4rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
        }

        @media (min-width: 768px) {
            .month-header {
                margin-bottom: 1.25rem;
                padding: 0.5rem;
            }
        }

        .month-title {
            font-family: var(--font-retro);
            font-size: 0.7rem;
            color: var(--neon-yellow);
            text-shadow: 0 0 5px rgba(255, 255, 0, 0.5);
            text-transform: uppercase;
        }

        @media (min-width: 768px) {
            .month-title {
                font-size: 0.8rem;
            }
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            padding: 0.25rem 0.4rem;
            font-family: var(--font-retro);
            font-size: 0.7rem;
            transition: all 0.1s ease;
        }

        @media (min-width: 768px) {
            .nav-btn {
                font-size: 0.8rem;
            }
        }

        .nav-btn:hover {
            color: var(--neon-green);
            transform: scale(1.2);
        }

        /* Calendar Grid */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            margin-bottom: 0.75rem;
        }

        @media (min-width: 768px) {
            .calendar-grid {
                gap: 4px;
                margin-bottom: 1rem;
            }
        }

        .weekday-label {
            font-family: var(--font-retro);
            font-size: 0.45rem;
            color: var(--neon-blue);
            text-align: center;
            padding-bottom: 0.4rem;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (min-width: 768px) {
            .weekday-label {
                font-size: 0.5rem;
                padding-bottom: 0.5rem;
            }
        }

        .calendar-day {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            aspect-ratio: 1;
            padding: 0.15rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            position: relative;
            transition: all 0.15s ease;
        }

        @media (min-width: 768px) {
            .calendar-day {
                padding: 0.25rem;
            }
        }

        .calendar-day:hover {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .calendar-day.empty {
            background-color: transparent;
            border-color: transparent;
            cursor: default;
            pointer-events: none;
        }

        .day-number {
            font-family: var(--font-retro);
            font-size: 0.45rem;
            color: rgba(255, 255, 255, 0.4);
            align-self: flex-start;
        }

        @media (min-width: 768px) {
            .day-number {
                font-size: 0.55rem;
            }
        }

        .calendar-day.today {
            border: 1.5px solid var(--neon-yellow);
            background-color: rgba(255, 255, 0, 0.05);
        }

        @media (min-width: 768px) {
            .calendar-day.today {
                border-width: 2px;
            }
        }

        .calendar-day.today .day-number {
            color: var(--neon-yellow);
        }

        .day-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 1px;
            margin-top: auto;
            width: 100%;
        }

        /* Tiny Retro pixel team dots */
        .day-badge {
            width: 100%;
            height: 6px;
            font-size: 0.35rem;
            font-family: var(--font-retro);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-shadow: 1px 1px 0px #000;
            border-radius: 1px;
            font-weight: bold;
            overflow: hidden;
            line-height: 1;
            text-align: center;
        }

        @media (min-width: 600px) {
            .day-badge {
                width: calc(50% - 1px);
                height: 8px;
                font-size: 0.4rem;
            }
        }

        @media (min-width: 768px) {
            .day-badge {
                height: 10px;
                font-size: 0.45rem;
                border-radius: 2px;
            }
        }

        /* Sidebar Schedule & Event Details */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @media (min-width: 900px) {
            .sidebar {
                gap: 1.5rem;
            }
        }

        .sidebar-panel {
            background-color: var(--screen-bg);
            border: 3px solid var(--neon-yellow);
            border-radius: 8px;
            padding: 0.75rem;
            box-shadow: 0 0 10px rgba(255, 255, 0, 0.15);
        }

        @media (min-width: 768px) {
            .sidebar-panel {
                border-width: 4px;
                padding: 1.25rem;
            }
        }

        .sidebar-title {
            font-family: var(--font-retro);
            font-size: 0.65rem;
            color: var(--neon-yellow);
            margin-bottom: 0.6rem;
            padding-bottom: 0.4rem;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
        }

        @media (min-width: 768px) {
            .sidebar-title {
                font-size: 0.75rem;
                margin-bottom: 0.8rem;
            }
        }

        /* Game List */
        .game-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        @media (min-width: 768px) {
            .game-list {
                gap: 0.75rem;
                max-height: 380px;
            }
        }

        .game-list::-webkit-scrollbar {
            width: 6px;
        }

        .game-list::-webkit-scrollbar-track {
            background: #191b2c;
        }

        .game-list::-webkit-scrollbar-thumb {
            background: var(--neon-yellow);
            border-radius: 3px;
        }

        .game-item {
            background-color: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        @media (min-width: 768px) {
            .game-item {
                padding: 0.6rem;
            }
        }

        .game-item:hover {
            border-color: var(--neon-yellow);
            background-color: rgba(255, 255, 255, 0.03);
            transform: scale(1.01);
        }

        .game-item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-item-date {
            font-family: var(--font-retro);
            font-size: 0.45rem;
            color: var(--neon-blue);
        }

        .game-item-type {
            font-size: 0.6rem;
            text-transform: uppercase;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            padding: 1px 4px;
            border-radius: 3px;
            background-color: rgba(255, 255, 255, 0.08);
        }

        .game-item-match {
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        @media (min-width: 768px) {
            .game-item-match {
                font-size: 0.95rem;
            }
        }

        .game-team-label {
            font-family: var(--font-retro);
            font-size: 0.5rem;
            padding: 1px 3px;
            border-radius: 2px;
            color: white;
            text-shadow: 1px 1px 0px #000;
        }

        @media (min-width: 768px) {
            .game-team-label {
                font-size: 0.55rem;
                padding: 2px 4px;
                border-radius: 3px;
            }
        }

        .game-item-info {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            justify-content: space-between;
        }

        /* Detail Modal / Panel */
        .detail-panel {
            background-color: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 0.6rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            font-size: 0.75rem;
        }

        @media (min-width: 768px) {
            .detail-panel {
                padding: 0.8rem;
                gap: 0.5rem;
                font-size: 0.85rem;
            }
        }

        .detail-header {
            font-family: var(--font-retro);
            font-size: 0.55rem;
            color: var(--neon-pink);
            text-shadow: 0 0 5px rgba(255, 0, 127, 0.4);
            margin-bottom: 0.25rem;
        }

        @media (min-width: 768px) {
            .detail-header {
                font-size: 0.6rem;
            }
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.2rem 0;
        }

        .detail-label {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
        }

        .detail-val {
            color: #ffffff;
            font-weight: 700;
        }

        /* General Instructions Footer */
        .footer-note {
            margin-top: 1rem;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
            font-family: var(--font-retro);
            line-height: 1.6;
        }

        @media (min-width: 768px) {
            .footer-note {
                margin-top: 1.5rem;
                font-size: 0.7rem;
            }
        }

        .footer-note a {
            color: var(--neon-green);
            text-decoration: none;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }

        /* Pixels illustration banner */
        .pixel-banner {
            display: flex;
            justify-content: space-between;
            height: 10px;
            background-image: repeating-linear-gradient(45deg, var(--neon-green) 0px, var(--neon-green) 5px, transparent 5px, transparent 10px);
            opacity: 0.3;
            margin: 1rem 0 0.25rem 0;
            border-radius: 4px;
        }

        @media (min-width: 768px) {
            .pixel-banner {
                height: 16px;
                background-image: repeating-linear-gradient(45deg, var(--neon-green) 0px, var(--neon-green) 10px, transparent 10px, transparent 20px);
                margin: 1.5rem 0 0.5rem 0;
            }
        }

        /* UF Home Game Highlights */
        .calendar-day.uf-home-day {
            border: 1.5px solid #FF8A00 !important;
            background-color: rgba(255, 138, 0, 0.08) !important;
            box-shadow: inset 0 0 6px rgba(255, 138, 0, 0.2);
        }
        .detail-panel.uf-home-detail {
            border: 2px solid #FF8A00 !important;
            background-color: rgba(255, 138, 0, 0.05) !important;
            box-shadow: 0 0 10px rgba(255, 138, 0, 0.25);
        }
        .detail-panel.uf-home-detail .detail-header {
            color: #FF8A00 !important;
            text-shadow: 0 0 8px rgba(255, 138, 0, 0.6) !important;
        }

        /* Mobile Optimizations */
        @media (max-width: 600px) {
            .arcade-cabinet {
                padding: 0.4rem;
                border-width: 3px;
                border-radius: 8px;
            }
            .scoreboard {
                justify-content: center;
                text-align: center;
                padding: 0.5rem;
            }
            .scoreboard-title {
                font-size: 0.65rem;
            }
            .panel-header {
                flex-direction: column;
                align-items: center;

        function initAudio() {

        // Web Audio API Retro SFX Generators
        function playCoinSound() {
            if (!sfxEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'square';
            osc.connect(gainNode);
            gainNode.connect(masterVolume);
            
            osc.frequency.setValueAtTime(987.77, now); // B5
            osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
            
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            
            osc.start(now);
            osc.stop(now + 0.35);
        }

            initAudio();
            const now = audioCtx.currentTime;

            const gainNode = audioCtx.createGain();
            
            osc.type = 'square';

            osc.frequency.setValueAtTime(600, now);

            osc.frequency.setValueAtTime(440, now);

        function playSnareDrum(startTime) {
            if (!sfxEnabled || !audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 0.08; // 80ms duration
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 1000;
            
            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.02, startTime); // Quiet snare beats
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + 0.07);
            
            noise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(masterVolume);
            
            noise.start(startTime);
            noise.stop(startTime + 0.08);
        }

            const freq = Math.pow(2, (midiNum - 69) / 12) * 440;
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = waveType;
            osc.frequency.value = freq;
            
            osc.connect(gainNode);
            gainNode.connect(masterVolume);
            
            gainNode.gain.setValueAtTime(waveType === 'square' ? 0.05 : 0.08, startTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration - 0.02);
            
            osc.start(startTime);
            osc.stop(startTime + duration);
        }

            const keys = Object.keys(TEAM_CONFIG);
            const othersEnabled = keys.every(key => {
                if (key === 'UCF') return true;
                return !disabledTeams.has(key);
            });

            const titleEl = document.querySelector('.scoreboard-title');
            if (ucfDisabled && othersEnabled) {
                // Easter egg active!
                titleEl.textContent = "JAINIL MODE";
                titleEl.style.color = "var(--neon-pink)";
                titleEl.style.textShadow = "0 0 10px rgba(255, 0, 127, 0.8)";
                playPowerDownSound();
                
                // Audio speech easter egg vocal
                if (sfxEnabled && window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance("Jainil Mode Activated!");
                    utterance.rate = 1.05;
                    utterance.pitch = 0.9;
                    window.speechSynthesis.speak(utterance);
                }
            } else {
                // Reset to standard header
                titleEl.textContent = "Fall 2026 Sports Calendar";
                titleEl.style.color = "var(--neon-green)";
                titleEl.style.textShadow = "0 0 8px rgba(57, 255, 20, 0.6)";
            }
        }

        // Filter functions
        const teamButtons = document.querySelectorAll('.arcade-btn');
        teamButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const team = btn.getAttribute('data-team');
                if (disabledTeams.has(team)) {
                    disabledTeams.delete(team);
                    btn.classList.remove('disabled');
                    playCoinSound();
                } else {
                    disabledTeams.add(team);
                    btn.classList.add('disabled');
                    playCoinSound();
                }
                checkJainilEasterEgg();
                renderCalendar();
                renderSidebarList();
            });
        });

        // Time sorting helper: converts a time string to minutes from start of day, putting TBA last
        function parseTimeToMinutes(timeStr) {
            if (!timeStr || timeStr === 'TBA') {
                return 99999; // Put TBAs last
            }
            const match = timeStr.match(/^(\d+):(\d+)\s*(AM|PM)$/i);
            if (!match) {
                return 99999;
            }
            let hours = parseInt(match[1]);
            const minutes = parseInt(match[2]);
            const ampm = match[3].toUpperCase();
            
            if (ampm === 'PM' && hours < 12) {
                hours += 12;
            } else if (ampm === 'AM' && hours === 12) {
                hours = 0;
            }
            
            return hours * 60 + minutes;
        }

        // Month Navigation Event Listeners
        document.getElementById('prev-month').addEventListener('click', () => {
            // Clamp to Fall 2026 (August to December)
            if (currentDate.getMonth() > 7 || currentDate.getFullYear() > 2026) {
                currentDate.setMonth(currentDate.getMonth() - 1);
                playCoinSound();
                renderCalendar();
                renderSidebarList();
            }
        });

        document.getElementById('next-month').addEventListener('click', () => {
            // Clamp to Fall 2026 (August to December)
            if (currentDate.getMonth() < 11 || currentDate.getFullYear() < 2026) {
                currentDate.setMonth(currentDate.getMonth() + 1);
                playCoinSound();
                renderCalendar();
                renderSidebarList();
            }
        });

        // Render Calendar Grid
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Set Month Title
            document.getElementById('month-display').textContent = `${MONTH_NAMES[month]} ${year}`;

            const daysContainer = document.getElementById('calendar-days');
            daysContainer.innerHTML = '';

            // Get first day of month index and number of days (adjusted for Monday start)
            const firstDayIndex = new Date(year, month, 1).getDay();
            const emptyCellsCount = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
            const totalDays = new Date(year, month + 1, 0).getDate();

            // Render empty cells for padding
            for (let i = 0; i < emptyCellsCount; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-day empty';
                daysContainer.appendChild(emptyCell);
            }

            // Render days
            for (let day = 1; day <= totalDays; day++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'calendar-day';
                
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                // Today highlight check
                if (year === 2026 && month === 6 && day === 18) {
                    dayCell.classList.add('today');
                }

                // Add day number
                const dayNum = document.createElement('span');
                dayNum.className = 'day-number';
                dayNum.textContent = day;
                dayCell.appendChild(dayNum);

                // Find active games on this date
                const activeGamesOnDay = GAMES.filter(game => {
                    return game.date === dateStr && !disabledTeams.has(game.team);
                });

                // Highlight UF Home games
                const hasUfHomeGame = activeGamesOnDay.some(game => game.team === 'UF' && game.type === 'Home');
                if (hasUfHomeGame) {
                    dayCell.classList.add('uf-home-day');
                }

                // Add pixel badges for games
                if (activeGamesOnDay.length > 0) {
                    const badgesContainer = document.createElement('div');
                    badgesContainer.className = 'day-badges';

                    activeGamesOnDay.forEach(game => {
                        const badge = document.createElement('div');
                        badge.className = 'day-badge';
                        badge.style.backgroundColor = TEAM_CONFIG[game.team].color;
                        badge.textContent = TEAM_CONFIG[game.team].abbr;
                        badge.title = `${TEAM_CONFIG[game.team].name} vs ${game.opponent}`;
                        badgesContainer.appendChild(badge);
                    });

                    dayCell.appendChild(badgesContainer);
                }

                // Click event on day
                dayCell.addEventListener('click', () => {
                    playCoinSound();
                    
                    // Highlight active day element
                    if (activeSelectedDayEl) {
                        activeSelectedDayEl.style.borderColor = 'rgba(255, 255, 255, 0.05)';
                    }
                    dayCell.style.borderColor = 'var(--neon-pink)';
                    activeSelectedDayEl = dayCell;

                    showGameDetails(dateStr, activeGamesOnDay);
                });

                daysContainer.appendChild(dayCell);
            }
        }

        // Show detailed game info
        function showGameDetails(dateStr, games) {
            const container = document.getElementById('game-detail-container');
            container.innerHTML = '';

            const dateFormatted = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', {
                weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
            });

            if (games.length === 0) {
                container.innerHTML = `
                    <div class="detail-panel">
                        <div class="detail-header" style="text-align: center;">${dateFormatted}</div>
                        <p style="color: rgba(255,255,255,0.4); text-align: center; font-size: 0.75rem; padding: 1rem 0;">
                            NO ACTIVE GAMES TODAY
                        </p>
                    </div>
                `;
                return;
            }

            // Sort games on the clicked day: UF Home games go to the top, then sort by time chronologically
            const sortedGamesOnDay = [...games].sort((a, b) => {
                const aIsUfHome = (a.team === 'UF' && a.type === 'Home');
                const bIsUfHome = (b.team === 'UF' && b.type === 'Home');
                if (aIsUfHome && !bIsUfHome) return -1;
                if (!aIsUfHome && bIsUfHome) return 1;
                return parseTimeToMinutes(a.time) - parseTimeToMinutes(b.time);
            });

            sortedGamesOnDay.forEach((game, index) => {
                const gameDiv = document.createElement('div');
                gameDiv.className = 'detail-panel';
                if (index > 0) gameDiv.style.marginTop = '1rem';

                const isUfHome = (game.team === 'UF' && game.type === 'Home');
                if (isUfHome) {
                    gameDiv.classList.add('uf-home-detail');
                }

                const header = document.createElement('div');
                header.className = 'detail-header';
                if (isUfHome) {
                    header.textContent = `★ ${TEAM_CONFIG[game.team].name.toUpperCase()} (HOME) ★`;
                } else {
                    header.textContent = `${TEAM_CONFIG[game.team].name.toUpperCase()}`;
                }
                gameDiv.appendChild(header);

                const table = [
                    { label: 'Date', val: dateFormatted },
                    { label: 'Opponent', val: game.opponent },
                    { label: 'Format', val: `${game.sport} (${game.type})` },
                    { label: 'Kickoff/Start', val: game.time },
                    { label: 'Broadcast', val: game.channel }
                ];

                table.forEach(row => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'detail-row';
                    rowDiv.innerHTML = `
                        <span class="detail-label">${row.label}</span>
                        <span class="detail-val" style="${row.label === 'Opponent' ? 'color: var(--neon-yellow)' : ''}">${row.val}</span>
                    `;
                    gameDiv.appendChild(rowDiv);
                });

                if (game.details) {
                    const descDiv = document.createElement('div');
                    descDiv.style.fontSize = '0.75rem';
                    descDiv.style.marginTop = '0.5rem';
                    descDiv.style.color = '#ccc';
                    descDiv.innerHTML = `<span style="color: var(--neon-blue); font-family: var(--font-retro); font-size: 0.55rem; display:block; margin-bottom: 2px;">RECON:</span> ${game.details}`;
                    gameDiv.appendChild(descDiv);
                }

                container.appendChild(gameDiv);
            });
        }

        // Render Sidebar Monthly list (Sorted chronologically by day, with TBAs last)
        function renderSidebarList() {
            const month = currentDate.getMonth();
            const listContainer = document.getElementById('sidebar-games-list');
            listContainer.innerHTML = '';

            document.getElementById('list-title').textContent = `GAMES IN ${MONTH_NAMES[month]}`;

            // Get games in selected month that are not filtered out, sorted by date first, then by time (TBA last)
            const monthGames = GAMES.filter(game => {
                const gameDate = new Date(game.date + 'T00:00:00');
                return gameDate.getMonth() === month && !disabledTeams.has(game.team);
            }).sort((a, b) => {
                const dateDiff = new Date(a.date) - new Date(b.date);
                if (dateDiff !== 0) return dateDiff;
                return parseTimeToMinutes(a.time) - parseTimeToMinutes(b.time);
            });

            if (monthGames.length === 0) {
                listContainer.innerHTML = `
                    <p style="color: rgba(255,255,255,0.4); text-align: center; font-size: 0.75rem; padding: 2rem 0; font-family: var(--font-retro);">
                        NO ACTIVE GAMES THIS MONTH
                    </p>
                `;
                return;
            }

            monthGames.forEach(game => {
                const dateObj = new Date(game.date + 'T00:00:00');
                const dateStr = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' });

                const item = document.createElement('div');
                item.className = 'game-item';
                item.innerHTML = `
                    <div class="game-item-top">
                        <span class="game-item-date">${dateStr.toUpperCase()}</span>
                        <span class="game-item-type">${game.type}</span>
                    </div>
                    <div class="game-item-match">
                        <span class="game-team-label" style="background-color: ${TEAM_CONFIG[game.team].color}">${TEAM_CONFIG[game.team].abbr}</span>
                        <span>vs ${game.opponent}</span>
                    </div>
                    <div class="game-item-info">
                        <span>${game.time}</span>
                        <span style="color: var(--neon-yellow)">${game.channel}</span>
                    </div>
                `;

                item.addEventListener('click', () => {
                    playCoinSound();
                    
                    // Highlight matching date in calendar
                    const dayNum = dateObj.getDate();
                    const dayCells = document.querySelectorAll('.calendar-day:not(.empty)');
                    dayCells.forEach(cell => {
                        if (parseInt(cell.querySelector('.day-number').textContent) === dayNum) {
                            if (activeSelectedDayEl) {
                                activeSelectedDayEl.style.borderColor = 'rgba(255, 255, 255, 0.05)';
                            }
                            cell.style.borderColor = 'var(--neon-pink)';
                            activeSelectedDayEl = cell;
                        }
                    });

                    // Trigger scout panel display
                    const dateFullStr = game.date;
                    const gamesOnDay = GAMES.filter(g => g.date === dateFullStr && !disabledTeams.has(g.team));
                    showGameDetails(dateFullStr, gamesOnDay);
                });

                listContainer.appendChild(item);
            });
        }

        // Initialize display
        renderCalendar();
        renderSidebarList();
    </script>
</body>
</html>
